name: Build Windows EXE

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # 允许手动触发编译

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      # 修复1：升级到 v4 版本以消除 Node.js 20 弃用警告
      - name: Checkout Code
        uses: actions/checkout@v4

      # 修复1：明确指定 setup-go 版本，关闭缓存以避免 go.sum 报错
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: false 

      # 修复2：显式执行 go mod tidy，这会自动生成缺失的 go.sum 文件并下载依赖
      - name: Download Dependencies & Generate go.sum
        run: go mod tidy

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build EXE
        # 移除了可能引起网络下载超时的 webview2 embed，改用系统默认
        run: wails build -clean -platform windows/amd64

      - name: Upload EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ImageEditor-Windows-x64
          path: build/bin/*.exe

          
