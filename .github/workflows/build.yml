name: Build Windows EXE

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # 允许手动触发编译

jobs:
  build:
    runs-on: windows-latest # 使用 Windows 虚拟机进行编译
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Download Go Dependencies
        run: go mod tidy

      - name: Build EXE (No Console Window)
        # -platform windows/amd64 指定编译 Windows 64位
        # -webview2 embed 将 WebView2 运行时打包进去，确保没装 Edge 的电脑也能跑
        run: wails build -clean -platform windows/amd64 -webview2 embed

      - name: Upload EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ImageEditor-Windows-x64
          path: build/bin/*.exe
